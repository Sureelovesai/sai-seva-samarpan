<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f2937" />
  <title>Offline - Sai Seva Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue",
        sans-serif;
      background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1f2937;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      max-width: 480px;
      width: 100%;
      padding: 40px 30px;
      text-align: center;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: #f3f4f6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #1f2937;
      font-weight: 600;
    }

    p {
      font-size: 16px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .button {
      display: inline-block;
      background: #1f2937;
      color: white;
      padding: 12px 28px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      margin-top: 8px;
      transition: background 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .button:hover {
      background: #111827;
    }

    .button-secondary {
      background: #e5e7eb;
      color: #1f2937;
      margin-left: 8px;
    }

    .button-secondary:hover {
      background: #d1d5db;
    }

    .info {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #e5e7eb;
    }

    .info p {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 24px;
      }

      p {
        font-size: 15px;
      }

      .button {
        display: block;
        width: 100%;
        margin: 8px 0;
      }

      .button-secondary {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. Some features may not
      be available right now.
    </p>
    <div>
      <button class="button" onclick="window.location.reload()">
        Try Again
      </button>
      <button class="button button-secondary" onclick="window.history.back()">
        Go Back
      </button>
    </div>
    <div class="info">
      <p>✓ Cached content may still be available</p>
      <p>✓ Check your connection and try again</p>
    </div>
  </div>
</body>
</html>
